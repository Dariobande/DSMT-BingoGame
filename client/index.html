<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="error-container">
        <div id="error-message"></div>
    </div>
    <div id="auth-section">
        <h2>Login Page</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div class="button-row">
            <button id="btn-login">Login</button>
            <button id="btn-go-register">Registration Page</button>
        </div>
        <p id="auth-msg"></p>
    </div>

    <div id="register-section" style="display:none;">
        <h2>Registration Page</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">
        <input type="password" id="confirm-password" placeholder="Confirm Password">
        <div class="button-row">
            <button id="btn-register">Register</button>
            <button id="btn-go-login">Login Page</button>
        </div>
        
        <p id="register-msg"></p>
    </div>

    <div id="game-section" style="display:none;">
        <h2>Welcome, <span id="user-display"></span>! Balance: <span id="balance-display"></span></h2>
        
        <div id="lobby">
            <button id="btn-create">Create a Game</button>
            <button id="btn-refresh">Refresh</button>
        </div>

        <div id="lobby-games-list"></div>

        <div id="play-area" style="display:none;">
            <h3>Last Drawn Number: <span id="last-number"></span></h3>
            <p>Players in this game: <span id="players-count-game">1</span></p>
            <button id="btn-start" style="display:none;">Start Game</button>
            <button id="btn-buy">Buy Card (10 coins)</button>
            <button id="btn-ready">Ready To Play</button>

            <div id="cards-container"></div>
            
            <div id="controls">
                <button id="btn-ambo">Ambo</button>
                <button id="btn-terno">Terno</button>
                <button id="btn-quaterna">Quaterna</button>
                <button id="btn-cinquina">Cinquina</button>
                <button id="btn-tombola">Tombola!</button>
            </div>
            <p id="game-log"></p>
            <button id="btn-leave">Leave Game</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
