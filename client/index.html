<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Distributed Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-section">
        <h2>Login Page</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div class="button-row">
            <button onclick="login()">Login</button>
            <button onclick="goRegister()">Registration Page</button>
        </div>
        <p id="auth-msg"></p>
    </div>

    <div id="register-section" style="display:none;">
        <h2>Registration Page</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">
        <input type="password" id="confirm-password" placeholder="Confirm Password">
        <button onclick="register()">Register</button>
        <p id="register-msg"></p>
    </div>

    <div id="game-section" style="display:none;">
        <h2>Welcome, <span id="user-display"></span>! Balance: <span id="balance-display"></span></h2>
        
        <div id="lobby">
            <input type="text" id="game-id-input" placeholder="Game ID">
            <button onclick="createGame()">Create Game</button>
            <button onclick="joinGame()">Join Game</button>
        </div>

        <div id="play-area" style="display:none;">
            <h3>Last Drawn Number: <span id="last-number" style="font-size: 2em; color: red;">-</span></h3>
            <button id="btn-start" onclick="startGame()" style="display:none;">Start Game</button>
            <button onclick="buyCard()">Buy Card (10 coins)</button>
            
            <div id="cards-container"></div>
            
            <div id="controls">
                <button onclick="claimWin('ambo')">Ambo</button>
                <button onclick="claimWin('terno')">Terno</button>
                <button onclick="claimWin('quaterna')">Quaterna</button>
                <button onclick="claimWin('cinquina')">Cinquina</button>
                <button onclick="claimWin('tombola')">Tombola!</button>
            </div>
            <p id="game-log"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
