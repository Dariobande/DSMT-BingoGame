# nginx.conf
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Load balancing based on the least connection policy 
    upstream erlang_backend {
        least_conn; 
        
        # Assuming our two Cowboy nodes are mapped to these addresses/ports.
        server 127.0.0.1:8081; 
        server 127.0.0.1:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Web Server for static files 
        location / {
            root /usr/share/nginx/html; # Directory containing index.html, style.css, app.js
            index index.html;
        }

        # 2. Proxy for HTTP APIs (Login & Register) [cite: 50, 51]
        location /api/ {
            proxy_pass http://erlang_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Proxy for WebSocket connections 
        location /ws {
            proxy_pass http://erlang_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            # Timeout settings to keep the connection alive
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}